[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barber-slot-bot"
version = "0.1.0"
description = "AI-assisted overdue client slot matching for barbers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic-settings>=2.2.1",
  "requests>=2.32.3",
  "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[project.scripts]
barber-slot-bot = "barber_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
